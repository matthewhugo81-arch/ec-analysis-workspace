<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EC Analysis</title><meta name="description" content="ECMWF four-panel analysis, same-valid-time run consistency and water-vapour comparison and OPERA radar."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e2032'/%3E%3Cpath d='M5 12h22M5 20h22M12 5v22M20 5v22' stroke='%2356c4dc' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script src="satellite.js" defer></script><script src="app.js" defer></script></head><body>
<header><div class="brand"><span class="mark">EC</span><h1>Analysis workspace</h1></div><span class="region">NORTH ATLANTIC <span> / ECMWF</span></span></header>
<main><div class="workspace-toolbar"><nav aria-label="Analysis views"><button data-view="overview" aria-pressed="true">Four-panel analysis</button><button data-view="consistency" aria-pressed="false">Run consistency</button><button data-view="water" aria-pressed="false">PV & water vapour</button><button data-view="radar" aria-pressed="false">OPERA radar</button></nav>
<section id="radar-controls" class="radar-controls" hidden><button id="radar-back">Previous frame</button><button id="radar-play" aria-pressed="false">Play radar</button><button id="radar-next">Next frame</button><button id="radar-latest">Latest</button><button id="radar-reload">Refresh radar</button><input id="radar-slider" type="range" min="0" max="0" value="0" aria-label="Radar observation timeline"><strong id="radar-time" aria-live="off">Loading observations…</strong><a href="https://www.eumetnet.eu/observations/opera-radar-animation/" target="_blank" rel="noopener">EUMETNET source</a></section><section class="controls" aria-label="Forecast controls"><label>Run date<input id="date" type="date" required></label><label>Cycle<select id="run"><option value="00">00Z</option><option value="12">12Z</option></select></label><div class="forecast"><span class="field-label">Forecast lead</span><div class="steps"><button data-step="-12" aria-label="Back 12 hours">−12h</button><button data-step="-6" aria-label="Back 6 hours">−6h</button><select id="hour" aria-label="Forecast hour"></select><button data-step="6" aria-label="Forward 6 hours">+6h</button><button data-step="12" aria-label="Forward 12 hours">+12h</button></div></div><button id="load">Reload charts</button><button id="loop" aria-pressed="false">Play loop</button><label>Loop speed<select id="speed"><option value="1500">1.5 seconds</option><option value="3000" selected>3 seconds</option><option value="5000">5 seconds</option></select></label></section></div>
<section class="timebar"><div><span>INITIALIZED</span><strong id="initialized"></strong></div><div><span>VALID TIME · UTC</span><strong id="valid"></strong></div><div class="lead"><span>FORECAST</span><strong id="lead"></strong></div></section>
<div class="timeline"><span>+000h</span><input id="slider" aria-label="Forecast timeline" type="range" min="0" max="240" step="6" value="0"><span>+240h</span></div>
<p id="context" class="context"></p><section id="grid" class="grid" aria-label="Analysis charts"></section>
<footer><span>Charts: <a href="https://spakort.vedur.is/" target="_blank" rel="noopener">Icelandic Met Office</a> · WV: <a href="https://www.meteociel.fr/" target="_blank" rel="noopener">Meteociel</a> · Radar: <a href="https://www.eumetnet.eu/observations/opera-radar-animation/" target="_blank" rel="noopener">EUMETNET / OPERA</a></span><span>All run and valid times are UTC · ← / → step 6h</span></footer></main>
<dialog id="zoom"><div class="zoom-head"><strong id="zoom-title"></strong><button id="close-zoom">Close</button></div><img id="zoom-image" alt=""></dialog></body></html>
